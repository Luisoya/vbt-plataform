<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Visor de rendimiento">
  <defs>
    <!-- Acero cepillado -->
    <linearGradient id="steelV" gradientUnits="userSpaceOnUse" x1="0" y1="10" x2="0" y2="36">
      <stop offset="0" stop-color="#eef1f4"/>
      <stop offset="0.35" stop-color="#9aa3ad"/>
      <stop offset="0.6" stop-color="#d5dae0"/>
      <stop offset="1" stop-color="#6e7781"/>
    </linearGradient>
    <linearGradient id="steelH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e7781"/>
      <stop offset="0.45" stop-color="#e6eaee"/>
      <stop offset="1" stop-color="#7d8690"/>
    </linearGradient>
  </defs>

  <!-- Fondo blanco -->
  <rect x="0.5" y="0.5" width="63" height="63" rx="12" fill="#ffffff" stroke="#e3e6ec"/>

  <!-- M: barras oblicuas de acero (debajo de los montantes) -->
  <polyline points="13.5,12 32,31 50.5,12" fill="none" stroke="url(#steelV)" stroke-width="6" stroke-linejoin="miter"/>

  <!-- M: montantes verticales negros del rack, con sus agujeros -->
  <rect x="10" y="10" width="7" height="47" rx="1" fill="#111111"/>
  <rect x="47" y="10" width="7" height="47" rx="1" fill="#111111"/>
  <g fill="#ffffff">
    <rect x="12.5" y="16" width="2" height="2.5" rx="0.5"/>
    <rect x="12.5" y="22" width="2" height="2.5" rx="0.5"/>
    <rect x="12.5" y="28" width="2" height="2.5" rx="0.5"/>
    <rect x="12.5" y="34" width="2" height="2.5" rx="0.5"/>
    <rect x="12.5" y="40" width="2" height="2.5" rx="0.5"/>
    <rect x="12.5" y="46" width="2" height="2.5" rx="0.5"/>
    <rect x="49.5" y="16" width="2" height="2.5" rx="0.5"/>
    <rect x="49.5" y="22" width="2" height="2.5" rx="0.5"/>
    <rect x="49.5" y="28" width="2" height="2.5" rx="0.5"/>
    <rect x="49.5" y="34" width="2" height="2.5" rx="0.5"/>
    <rect x="49.5" y="40" width="2" height="2.5" rx="0.5"/>
    <rect x="49.5" y="46" width="2" height="2.5" rx="0.5"/>
  </g>

  <!-- I: mancuerna vertical (discos negros, barra de acero) -->
  <rect x="30.25" y="41" width="3.5" height="13" fill="url(#steelH)"/>
  <rect x="24" y="37.5" width="16" height="3.5" rx="1" fill="#111111"/>
  <rect x="26" y="41" width="12" height="2.2" rx="0.6" fill="#111111"/>
  <rect x="26" y="51.8" width="12" height="2.2" rx="0.6" fill="#111111"/>
  <rect x="24" y="54" width="16" height="3.5" rx="1" fill="#111111"/>
</svg>
